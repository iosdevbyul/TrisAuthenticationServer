name: waktrainer-auth-local
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vapor
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      POSTGRES_DB: waktrainer
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - auth_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapor -d waktrainer"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  auth_local_data:
