name: OpenAPI contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/openapi-requirements.txt
      - run: pip install -r scripts/openapi-requirements.txt
      - run: python scripts/openapi.py --check
      - run: python -m unittest discover -s scripts -p 'test_openapi.py'
