name: OpenAPI contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/openapi-requirements.txt
      - run: pip install -r scripts/openapi-requirements.txt
      - run: python scripts/openapi.py --check
      - run: python -m unittest discover -s scripts -p 'test_*.py'

  swift:
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: waktrainer_test_auth
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d waktrainer_test_auth"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_NAME: waktrainer_test_auth
      TEST_DATABASE_HOST: postgres
      TEST_DATABASE_PORT: '5432'
      TEST_DATABASE_USERNAME: postgres
      # Exercise pool ownership without relying on the runner's CPU/event-loop count.
      NIO_SINGLETON_GROUP_LOOP_COUNT: '1'
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      # Distinct SwiftPM roots must not share build plans/test discovery caches.
      - run: swift build --package-path Packages/AuthenticationServerKit
      # Both integration suites use the same disposable database, in sequence.
      - run: swift test --package-path Packages/AuthenticationServerKit --no-parallel
      - run: swift test --no-parallel
